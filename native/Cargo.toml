[workspace]
resolver = "3"
members = ["crates/mesh-runtime", "crates/mesh-import", "crates/py-meshloader", "crates/meshloader"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[workspace.dependencies]
unrealsdk-rs = { git = "https://github.com/juso40/unrealsdk-rs.git", tag = "v0.1.0" }
mesh-runtime = { path = "crates/mesh-runtime" }
mesh-import = { path = "crates/mesh-import" }
py-meshloader = { path = "crates/py-meshloader" }
pyo3 = { version = "0.29", features = ["abi3-py314", "generate-import-lib"] }
pyo3-stub-gen = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
